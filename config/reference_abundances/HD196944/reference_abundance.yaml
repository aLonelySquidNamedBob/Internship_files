# Reference absolute abundances, A(X) = log N(X)/N(H) + 12.
# Source: Merle et al., "Barium and europium isotopic ratios", table of absolute and relative
# abundances (transcribed from a photo, 2026-10-06). Starting point only; to be rederived.
# error: printed uncertainty (null where none is given). null entry: not measured in the paper.
# nlte: true marks values the paper says include non-LTE corrections (Fe, Eu).

star: HD196944
name: "HD 196944"

abundances:
  C: {value: 7.46, error: 0.12}
  N: {value: 7.99, error: 0.30}
  O: {value: 7.43, error: 0.09}
  Mg: {value: 5.73, error: 0.07}
  Fe: {value: 5.50, error: 0.07, nlte: true}
  Si: {value: 5.78, error: 0.16}
  Sr: {value: 1.21, error: 0.13}
  Y: {value: 0.85, error: 0.08}
  Zr: {value: 1.33, error: 0.09}
  Ba: {value: 1.15, error: null, note: "3D non-LTE line modelling"}
  # paper also gives 1.19 from [Ba/Fe] = [Ce/Fe]
  La: {value: 0.16, error: 0.05}
  Ce: {value: 0.74, error: 0.07}
  Pr: {value: -0.38, error: 0.08}
  Nd: {value: 0.47, error: 0.08}
  Sm: {value: -0.17, error: 0.07}
  Eu: {value: -1.19, error: 0.09, nlte: true}
  Gd: {value: -0.14, error: 0.18}
  Dy: {value: -0.24, error: 0.14}
  Er: {value: -0.24, error: 0.08}
  Hf: {value: 0.13, error: 0.12}
  Pb: {value: 2.05, error: 0.08}

isotope_ratios:
  C12_C13: 4.5
