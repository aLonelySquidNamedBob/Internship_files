# Reference abundances transcribed from Merle et al., "Barium and europium isotopic ratios",
# table "Absolute and relative chemical abundances of the stellar sample".
# Transcribed from a photo of the printed table on 2026-10-06; every value re-checked against the image.
#
# Conventions
#   abundances: A(X) = log eps(X) = log10(N_X/N_H) + 12
#   relative:   [X/Fe], as printed (no solar scale applied here)
#   error:      the printed +/- value; null where the table gives none
#   null entry: the table shows a dash (not measured)
#   flags:      footnote symbols printed in the table. The footnote TEXT is not in the photo,
#               so meanings are NOT transcribed; check the paper before relying on them.
#                 asterisk  - '*' on the row label (A(Fe)*, A(Eu)*): applies to all stars
#                 square    - small open square after every Ba value
#                 dagger    - dagger after the first HD 196944 Ba value
#                 triangle  - open triangle (HE 2208-1239 A(N) and [N/Fe])
#
# INCOMPLETE: the photo cuts off at the [O/Fe] row (that row is only partly visible,
# but every digit is readable). Any rows below [O/Fe] are missing and are not transcribed.

star: HE22081239
name: "HE 2208-1239"

source:
  reference: "Merle et al., Barium and europium isotopic ratios"
  table: "Absolute and relative chemical abundances of the stellar sample"
  transcribed: "2026-10-06, from photo"
  complete: false  # rows below [O/Fe] cut off in the photo

